[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "civicbrain"
version = "0.14.0"
description = "Deterministic, glass-box civic triage and dispatch platform built for Indian ULBs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.53.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "sqlalchemy==2.0.54",
    "asyncpg==0.31.0",
    "geoalchemy2==0.20.0",
    "alembic==1.20.0",
    "redis==8.1.0",
    "httpx==0.28.1",
    "supabase==2.31.0",
    "psycopg2-binary==2.9.13",
    "splink==4.0.17",
    "python-multipart==0.0.32",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "hypothesis==6.168.0",
    "ruff==0.16.8",
    "mypy==2.3.1",
    "fakeredis==2.38.0",
    "bandit==1.9.4",
    "pip-audit==2.10.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["civicbrain"]
known-third-party = ["supabase"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
