name: Auto-Confirm Cron Trigger

on:
  schedule:
    # Run every hour at minute 0
    - cron: '0 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions console

jobs:
  auto-confirm:
    name: Trigger Auto-Confirm Cron
    runs-on: ubuntu-latest
    steps:
      - name: Call Auto-Confirm Endpoint
        env:
          APP_URL: ${{ secrets.CIVICBRAIN_APP_URL || 'https://civicbrain.onrender.com' }}
          SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          echo "Executing auto-confirm cron against ${APP_URL}/v1/dispatch/cron/auto-confirm..."
          curl -s -f -X POST "${APP_URL}/v1/dispatch/cron/auto-confirm" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${SERVICE_ROLE_KEY}" \
            -H "X-Cron-Secret: ${CRON_SECRET}" \
            || echo "Notice: Endpoint returned non-200 or backend instance is spinning up."
